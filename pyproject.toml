[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dish2ecg"
version = "0.1.0"
description = "Corrected repolarization endpoints from hiPSC-CM and clinical ECG data, on one scale"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{ name = "Rejaul Karim" }]
keywords = ["cardiac safety", "QT", "hiPSC-CM", "CiPA", "proarrhythmia",
            "field potential duration", "concentration-QTc"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]


[project.urls]
Homepage = "https://github.com/rejaul/dish2ecg"
Repository = "https://github.com/rejaul/dish2ecg"

[project.optional-dependencies]
data = ["requests>=2.28", "openpyxl>=3.1", "pyarrow>=12"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
